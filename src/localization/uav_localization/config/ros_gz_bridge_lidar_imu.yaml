# ros_gz_bridge topic map: Gazebo (gz-transport) -> ROS 2.
# Used by simulation/launch/sensors_bridge.launch.xml.
#
# Topic paths use "x500_lidar_0" — the static, statically-named vehicle
# instance defined directly in simulation/worlds/x500_lidar.sdf (world name
# "default"). See docs/LOCALIZATION.md for why the vehicle is placed
# statically in a custom world rather than dynamically spawned by PX4.

- ros_topic_name: "/lidar/points"
  gz_topic_name: "/world/default/model/x500_lidar_0/link/lidar_link/sensor/lidar/scan/points"
  ros_type_name: "sensor_msgs/msg/PointCloud2"
  gz_type_name: "gz.msgs.PointCloudPacked"
  direction: GZ_TO_ROS

- ros_topic_name: "/imu/data"
  gz_topic_name: "/world/default/model/x500_lidar_0/link/imu_link/sensor/imu/imu"
  ros_type_name: "sensor_msgs/msg/Imu"
  gz_type_name: "gz.msgs.IMU"
  direction: GZ_TO_ROS
